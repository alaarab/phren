packages:
  - "packages/*"

# Install scripts needed by the workspace build and extension packaging.
allowBuilds:
  '@vscode/vsce-sign': true
  electron: true
  esbuild: true
  node-pty: true

# Exact release-age exceptions recorded by pnpm for this dependency refresh.
minimumReleaseAgeExclude:
  - "@inquirer/ansi@2.0.9"
  - "@inquirer/checkbox@5.2.6"
  - "@inquirer/confirm@6.3.3"
  - "@inquirer/core@12.0.4"
  - "@inquirer/editor@5.3.4"
  - "@inquirer/expand@5.1.6"
  - "@inquirer/external-editor@3.0.6"
  - "@inquirer/input@5.1.7"
  - "@inquirer/number@4.2.4"
  - "@inquirer/password@5.2.3"
  - "@inquirer/prompts@8.7.3"
  - "@inquirer/rawlist@5.3.6"
  - "@inquirer/search@4.3.4"
  - "@inquirer/select@5.2.6"
  - "@inquirer/type@4.2.0"
  - hono@4.13.13
  - inquirer@14.2.3
  - "@phren/cli@0.3.30"

# Transitive-dependency pins, mostly security floors for packages we do not
# depend on directly.
#
# These live here rather than in package.json's `pnpm.overrides`: pnpm 10 no
# longer reads that field and warns it is ignoring it, so the pins survived
# only because they were already baked into the lockfile — the next resolve
# would have quietly dropped them. The npm-style top-level `overrides` block
# that sat beside it was never read by pnpm at all.
overrides:
  fast-uri: ^3.1.8
  flatted: ^3.4.4
  hono: ^4.13.13
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "@hono/node-server": ">=2.1.3"
  body-parser: ">=2.3.0"
  ip-address: ^10.7.3
  undici: ^8.11.2
  form-data: ">=4.0.6"
  vite: ^8.3.2
  uuid: ^14.0.2
  tmp: ">=0.2.7"
  ws: ">=8.22.0"
  # GHSA advisories on qs < 6.16.0. The previous floor of >=6.15.2 resolved to
  # 6.15.3, which is still inside the vulnerable range.
  qs: ">=6.16.0"
  brace-expansion: ^5.0.12
  markdown-it: ^15.0.2
  linkify-it: ^6.1.0
