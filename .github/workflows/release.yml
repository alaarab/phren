name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match packages/cli/package.json)
        required: true
        type: string

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    # Two dispatches of one version run one after the other, so the second sees
    # what the first published and tagged.
    concurrency:
      group: release-${{ github.event.inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      # The dispatch input is interpolated only here, into an env var, so it
      # reaches bash as data. Using `${{ }}` inside `run:` would splice it into
      # the script before bash parses it.
      INPUT_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Ensure version matches packages/cli and packages/agent
        # @phren/agent is version-locked to @phren/cli: it imports the CLI's
        # internal subpath exports, so it pins the exact CLI version it was
        # built against and both ship together.
        run: |
          for pkg in cli agent; do
            PKG_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
              echo "Version mismatch: packages/$pkg/package.json=$PKG_VERSION, input=$INPUT_VERSION"
              exit 1
            fi
          done

      - name: Ensure changelog contains this version
        run: |
          grep -q "^## \[$INPUT_VERSION\]" CHANGELOG.md || {
            echo "CHANGELOG.md missing header for $INPUT_VERSION"
            exit 1
          }

      - name: Require successful full release candidate validation of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/phren-rc-runs.json"
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import fs from "node:fs";
            const runs = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).workflow_runs;
            const run = runs.find(r => r.head_sha === process.env.GITHUB_SHA && r.event === "workflow_dispatch" && r.display_title === "RC validation" && r.status === "completed" && r.conclusion === "success");
            if (!run) { console.error("No successful full RC validation for this exact commit. Dispatch CI with release_candidate=true first."); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Full RC tests already passed for ${run.head_sha}: ${run.html_url}. Publication reuses that evidence without rerunning tests.\n`);
          ' "$RUNNER_TEMP/phren-rc-runs.json"


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Validate docs
        run: pnpm run validate-docs

      - name: Pack agent
        # pnpm pack rewrites the agent's `workspace:*` dependency on @phren/cli
        # to this exact version; npm publish of the directory would not.
        working-directory: packages/agent
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/phren-agent-$INPUT_VERSION.tgz"
          tar -xzOf "$RUNNER_TEMP/phren-agent-$INPUT_VERSION.tgz" package/package.json \
            | node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); if (m.dependencies["@phren/cli"] !== process.env.INPUT_VERSION) { console.error("@phren/agent does not pin @phren/cli " + process.env.INPUT_VERSION); process.exit(1); }'

      # A second dispatch of a version that already shipped (0.3.59 was dispatched
      # twice on 2026-10-28) must not fail on npm's "cannot publish over" refusal
      # or tag the release twice. Each publish step asks npm first: the version
      # published from this commit is skipped with a notice, one published from
      # another commit fails, and anything else is published as before.
      - name: Publish CLI package
        working-directory: packages/cli
        # The publish token is scoped to this step only. At job level it was
        # visible to install/build/lint/test, so any dependency script could
        # have used it to publish.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash ../../scripts/release-publish.sh "@phren/cli" .

      - name: Publish agent package
        # After @phren/cli, whose exact version it depends on.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/release-publish.sh "@phren/agent" "$RUNNER_TEMP/phren-agent-$INPUT_VERSION.tgz"

      - name: Create git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$INPUT_VERSION"
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY"
          # Asked of the remote, not this checkout: a run that checked out before
          # another pushed the tag would not have it. An annotated tag lists its
          # commit as the peeled `^{}` line.
          REMOTE=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}")
          TAGGED=$(printf '%s\n' "$REMOTE" | awk -v ref="refs/tags/v$VERSION^{}" '$2 == ref { print $1 }')
          if [ -z "$TAGGED" ]; then TAGGED=$(printf '%s\n' "$REMOTE" | awk -v ref="refs/tags/v$VERSION" '$2 == ref { print $1 }'); fi
          if [ "$TAGGED" = "$GITHUB_SHA" ]; then
            echo "::notice::v$VERSION is already tagged at this commit; nothing to push."
            echo "v$VERSION was already tagged at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$TAGGED" ]; then
            echo "::error::v$VERSION already exists at $TAGGED, not this commit ($GITHUB_SHA)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
