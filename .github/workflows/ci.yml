name: CI
run-name: ${{ github.event_name == 'schedule' && 'Nightly RC' || (inputs.release_candidate && 'RC validation' || 'Development build') }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 09:30 UTC is 01:30 Pacific. The nightly is a full release candidate but is
  # not release evidence: release.yml only accepts a workflow_dispatch run.
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Run the consolidated release candidate test suites
        type: boolean
        default: false

env:
  PHREN_RC: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release_candidate) }}

# Superseded commits should not keep consuming runners. The nightly has its own
# group so it never cancels a pending RC dispatch on main.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the others and hide their results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # The tmux provider's integration test runs against a real tmux; it
      # skips where there is none (Windows).
      - name: Install tmux (Linux)
        if: runner.os == 'Linux' && env.PHREN_RC == 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS' && env.PHREN_RC == 'true'
        run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release candidate tests
        if: env.PHREN_RC == 'true'
        run: pnpm test --coverage --maxWorkers=2
      - name: Development build summary
        if: env.PHREN_RC != 'true'
        run: echo 'Build passed. Tests deferred to the consolidated release candidate; tests were not run.' >> "$GITHUB_STEP_SUMMARY"

  # Known-vulnerable dependencies fail the build: every push, PR, nightly and
  # RC asks the registry about the lockfile, so a new high or critical advisory
  # shows up within a day without anyone pushing. Fix it with a bump or an
  # `overrides` entry in pnpm-workspace.yaml. Moderate and low are reported in
  # the job summary and do not fail.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: No high or critical advisories in the lockfile
        run: |
          set -o pipefail
          pnpm audit --audit-level high | tee audit.txt || status=$?
          { echo '```'; tail -n 40 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: No owner-private strings
        run: pnpm run check-private-strings
      - name: Build typecheck dependencies
        run: pnpm build
      - name: Typecheck all packages
        run: |
          for package in cli code agent vscode push-relay; do
            pnpm exec tsc --noEmit -p "packages/$package/tsconfig.json"
          done

  agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo's test task depends on build -> ^build, which produces the
      # packages/cli dist output the agent's tests import at runtime.
      - name: Build agent
        run: pnpm exec turbo run build --filter=@phren/agent
      - name: Release candidate agent tests
        if: env.PHREN_RC == 'true'
        run: pnpm --filter @phren/agent test
      - name: Development agent summary
        if: env.PHREN_RC != 'true'
        run: echo 'Agent build passed. Agent tests deferred to the consolidated release candidate; tests were not run.' >> "$GITHUB_STEP_SUMMARY"

  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate-docs

  browser-test:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release_candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build desktop UI dependencies
        run: |
          pnpm --filter @phren/desktop-kit build
          pnpm --filter @phren/desktop build
          pnpm --filter @phren/desktop-editor build
      - name: Desktop e2e
        run: pnpm exec playwright test -c packages/desktop/playwright.config.ts
      - name: Upload desktop Playwright failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-playwright
          retention-days: 3
          path: coverage/desktop-playwright/
          if-no-files-found: ignore

  nightly-report:
    if: github.event_name == 'schedule' && always()
    needs: [build-and-test, agent-test, browser-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD_RESULT: ${{ needs.build-and-test.result }}
      AGENT_RESULT: ${{ needs.agent-test.result }}
      BROWSER_RESULT: ${{ needs.browser-test.result }}
      ISSUE_TITLE: Nightly phren tests failing on main
    steps:
      - name: Open, comment on or close the nightly issue
        run: |
          set -euo pipefail
          failed=""
          for entry in "build-and-test:$BUILD_RESULT" "agent-test:$AGENT_RESULT" "browser-test:$BROWSER_RESULT"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            if [ "$result" != "success" ]; then
              failed="${failed}- ${name} (${result})"$'\n'
            fi
          done

          find_issue() {
            gh issue list --state all --limit 200 --search "\"$ISSUE_TITLE\" in:title" \
              --json number,title,state \
              --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | sort_by(.number) | last | select(. != null) | [(.number | tostring), .state] | join(\" \")"
          }

          body="$RUNNER_TEMP/nightly-body.md"
          found="$(find_issue)"  # a failed lookup stops the job instead of acting on a guess
          number=""; state=""
          if [ -n "$found" ]; then read -r number state <<<"$found"; fi
          if [ -n "$failed" ]; then
            {
              printf 'Nightly phren tests failed on main.\n\n'
              printf 'Run: %s\n\n' "$RUN_URL"
              printf 'Failed jobs:\n%s' "$failed"
            } > "$body"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file "$body"
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$number"
              fi
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$body"
            fi
          else
            {
              printf 'Nightly phren tests passed on main.\n\n'
              printf 'Run: %s\n' "$RUN_URL"
            } > "$body"
            if [ -n "$number" ] && [ "$state" = "OPEN" ]; then
              gh issue comment "$number" --body-file "$body"
              gh issue close "$number"
            fi
          fi
