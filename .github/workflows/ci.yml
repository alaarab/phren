name: CI
run-name: ${{ inputs.release_candidate && 'RC validation' || 'Development build' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Run the consolidated release candidate test suites
        type: boolean
        default: false

env:
  PHREN_RC: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate }}

# Superseded commits should not keep consuming runners.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the others and hide their results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # The tmux provider's integration test runs against a real tmux; it
      # skips where there is none (Windows).
      - name: Install tmux (Linux)
        if: runner.os == 'Linux' && env.PHREN_RC == 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS' && env.PHREN_RC == 'true'
        run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Release candidate tests
        if: env.PHREN_RC == 'true'
        run: pnpm test --coverage --maxWorkers=2
      - name: Development build summary
        if: env.PHREN_RC != 'true'
        run: echo 'Build passed. Tests deferred to the consolidated release candidate; tests were not run.' >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: No owner-private strings
        run: pnpm run check-private-strings
      - name: Build typecheck dependencies
        run: pnpm build
      - name: Typecheck all packages
        run: |
          for package in cli code agent vscode push-relay; do
            pnpm exec tsc --noEmit -p "packages/$package/tsconfig.json"
          done

  agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # turbo's test task depends on build -> ^build, which produces the
      # packages/cli dist output the agent's tests import at runtime.
      - name: Build agent
        run: pnpm exec turbo run build --filter=@phren/agent
      - name: Release candidate agent tests
        if: env.PHREN_RC == 'true'
        run: pnpm --filter @phren/agent test
      - name: Development agent summary
        if: env.PHREN_RC != 'true'
        run: echo 'Agent build passed. Agent tests deferred to the consolidated release candidate; tests were not run.' >> "$GITHUB_STEP_SUMMARY"

  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate-docs

  browser-test:
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build desktop UI dependencies
        run: |
          pnpm --filter @phren/desktop-kit build
          pnpm --filter @phren/desktop build
          pnpm --filter @phren/desktop-editor build
      - name: Desktop e2e
        run: pnpm exec playwright test -c packages/desktop/playwright.config.ts
      - name: Upload desktop Playwright failures
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-playwright
          retention-days: 3
          path: coverage/desktop-playwright/
          if-no-files-found: ignore

  # Advisory: starts the same release candidate on a gitboy instance at this
  # exact commit (.gitboy.yml, docs/gitboy-ci.md), which reports back as the
  # `gitboy/rc` commit status. Nothing waits on it: release.yml reads only
  # this workflow's own run, this job cannot fail the run, and without the
  # GITBOY_URL and GITBOY_TRIGGER_TOKEN secrets it does nothing.
  gitboy-rc:
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    permissions: {}
    env:
      GITBOY_URL: ${{ secrets.GITBOY_URL }}
      GITBOY_TRIGGER_TOKEN: ${{ secrets.GITBOY_TRIGGER_TOKEN }}
      GITBOY_REPO: ${{ vars.GITBOY_REPO || github.repository }}
      RC_SHA: ${{ github.sha }}
    steps:
      - name: Start the gitboy release candidate
        run: |
          if [ -z "$GITBOY_URL" ] || [ -z "$GITBOY_TRIGGER_TOKEN" ]; then
            echo "gitboy RC not configured"
            exit 0
          fi
          api="${GITBOY_URL%/}/api/v1/repos/$GITBOY_REPO"
          auth="Authorization: Bearer $GITBOY_TRIGGER_TOKEN"
          # Ask the pull mirror to fetch this commit now. Best effort: it needs
          # an account admin token, and instant sync usually got there first.
          printf '%s\n' "$auth" | curl -sS -o /dev/null -m 15 -X POST -H @- "$api/mirror/sync" || true
          body="$(jq -nc --arg sha "$RC_SHA" --arg repo "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{ref: $sha, variables: {PHREN_RC: "true", PHREN_RC_SHA: $sha, GITHUB_REPOSITORY: $repo, GITHUB_RUN_URL: $run}}')"
          # Until the mirror has the commit gitboy answers 400 "Ref does not
          # resolve to a commit"; keep asking for about four minutes.
          for attempt in $(seq 1 16); do
            code="$(printf '%s\n' "$auth" | curl -sS -o response.json -w '%{http_code}' -m 20 \
              -X POST -H @- -H 'Content-Type: application/json' --data "$body" "$api/pipelines" || true)"
            code="${code:-000}"
            if [ "$code" = 201 ]; then
              iid="$(jq -r '.iid // empty' response.json)"
              echo "Started gitboy pipeline #$iid at $RC_SHA."
              echo "Started gitboy release candidate pipeline #$iid at \`$RC_SHA\`; it reports as the \`gitboy/rc\` commit status." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$code" = 400 ] && grep -q 'does not resolve' response.json; then
              echo "gitboy does not have $RC_SHA yet (attempt $attempt); waiting for the mirror."
              sleep 15
              continue
            fi
            echo "::warning::gitboy RC not started: HTTP $code"
            exit 0
          done
          echo "::warning::gitboy RC not started: the mirror never received $RC_SHA"
