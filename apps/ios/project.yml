# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && cd apps/ios && xcodegen generate
# The .xcodeproj is generated locally and gitignored — this file is the
# source of truth for project settings.
name: Phren
options:
  bundleIdPrefix: com.phren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

packages:
  PhrenKit:
    path: PhrenKit
  PhrenLive:
    path: PhrenLive
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0

schemes:
  Phren:
    build:
      targets:
        Phren: all
    test:
      targets:
        - PhrenTests
        - PhrenUITests

targets:
  PhrenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhrenTests
    dependencies:
      - target: Phren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phren.ios.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"

  PhrenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PhrenUITests
    dependencies:
      - target: Phren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phren.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"

  Phren:
    type: application
    platform: iOS
    sources:
      # The graph renderer must keep its directory in the bundle: the page
      # loads phren-graph.js by relative URL, so a flattened copy breaks it.
      - path: Phren
        excludes:
          - "Resources/graph/**"
      - path: Phren/Resources/graph
        type: folder
        buildPhase: resources
      - Shared
    dependencies:
      - package: PhrenKit
      - package: PhrenLive
      - package: SwiftTerm
      - target: PhrenWidgets
        embed: true
    preBuildScripts:
      - name: Bundle memory graph
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          node "$SRCROOT/scripts/bundle-graph.mjs"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/bundle-graph.mjs
          - $(SRCROOT)/../../packages/cli/browser
          - $(SRCROOT)/../../packages/cli/src/graph-core
          - $(SRCROOT)/../../node_modules
          - $(SRCROOT)/../../packages/cli/node_modules
        outputFiles:
          - $(SRCROOT)/Phren/Resources/graph/phren-graph.js
    entitlements:
      path: Phren/Phren.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phren.ios
    # Only what has no INFOPLIST_KEY_ build-setting form lives here.
    # GENERATE_INFOPLIST_FILE stays on and merges the INFOPLIST_KEY_* settings
    # below into this file, so the plist keeps a single source per key rather
    # than a hand-maintained copy of everything Xcode already synthesizes.
    info:
      path: Phren/Info.plist
      properties:
        # XcodeGen's info: template otherwise hardcodes a literal "1.0"/"1"
        # here (see PhrenWidgets below). GENERATE_INFOPLIST_FILE's own
        # MARKETING_VERSION substitution currently wins over the file, but
        # only while it stays on — spell the versions out so the file is
        # right on its own terms either way.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PhrenGitHubClientID: "$(PHREN_GITHUB_CLIENT_ID)"
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
            # This exact browser origin is carried over the authenticated SSH
            # preview proxy. NSAllowsLocalNetworking does not cover .localhost.
            "phren-preview.localhost":
              NSExceptionAllowsInsecureHTTPLoads: true
        # Siri hears "phren" as "friend" or "fren" more often than not —
        # dictation has no entry for the word. These are the app names Siri
        # will also accept for "…to phren" phrases; the pronunciation hint
        # tells it they all sound like "fren".
        INAlternativeAppNames:
          - INAlternativeAppName: Fren
            INAlternativeAppNamePronunciationHint: fren
          - INAlternativeAppName: Friend
            INAlternativeAppNamePronunciationHint: fren
          - INAlternativeAppName: Phren
            INAlternativeAppNamePronunciationHint: fren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phren.ios
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PHREN_APP"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Phren records audio only while you dictate a note, task, or agent message."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Phren transcribes dictation into your draft, on this device when possible."
        INFOPLIST_KEY_NSCameraUsageDescription: "Phren uses the camera when you attach a photo to an agent message."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Phren connects to computers you add over SSH for agent status, chat, and attachments."
        # SSH now includes bundled cryptographic implementation (Swift Crypto).
        # Complete App Store Connect's encryption questionnaire for distribution;
        # the previous OS-only HTTPS exemption no longer describes this binary.
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: true

  PhrenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PhrenWidgets
      - Shared
    info:
      path: PhrenWidgets/Info.plist
      properties:
        CFBundleDisplayName: phren
        # XcodeGen's info: template otherwise hardcodes a literal "1.0"/"1"
        # here instead of tracking the target's own build settings, which
        # Xcode flags at build time ("must match that of its containing
        # parent app") once the two targets' versions drift.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PhrenWidgets/PhrenWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phren.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phren.ios.widgets
        PRODUCT_NAME: PhrenWidgets
        # Keep in lockstep with the Phren target above — App Store Connect
        # rejects an upload where the extension's version doesn't match its
        # containing app's.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: true
