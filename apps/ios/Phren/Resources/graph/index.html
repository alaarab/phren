<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none';">
<!-- viewport-fit=cover so the canvas runs under the home indicator; the HUD
     insets itself with env(safe-area-inset-*) below. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>phren graph</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060f; color: #dbe4ff;
    font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* The renderer handles its own gestures; without this iOS steals
       two-finger drags for page zoom and the camera fights the browser. */
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* The renderer switches this to position: relative at mount (scene.ts), and
     a relative box with auto height collapses to its content. Explicit 100%
     width and height keep the canvas tracking the web view's frame, which the
     resize observer then reads for the force graph. */
  #graph-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* SwiftUI provides search, filters and camera controls. Desktop overlays
     would cover most of a phone's canvas and offer unsupported actions. */
  .phren-project-nav, .phren-project-panel, .phren-pp-reopen,
  .phren-hud-legend, .phren-hud-stats { display: none !important; }
  #graph-canvas .phren-label { max-width: 132px; overflow: hidden; text-overflow: ellipsis; }
  #graph-canvas .phren-label--project { max-width: 160px; }
  #graph-status {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 12px); left: 50%;
    transform: translateX(-50%);
    padding: 6px 12px; border-radius: 999px;
    background: rgba(8, 10, 22, 0.85);
    border: 1px solid rgba(103, 232, 249, 0.25);
    font-size: 12px; letter-spacing: 0.02em;
    pointer-events: none; transition: opacity 200ms ease;
  }
  #graph-status[hidden] { display: none; }

  #graph-dossier {
    position: absolute;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    left: 12px;
    z-index: 20;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: 45%;
    padding: 12px;
    overflow: hidden;
    color: #dbe4ff;
    background: rgba(8, 10, 22, 0.92);
    border: 1px solid rgba(103, 232, 249, 0.22);
    border-radius: 14px;
    box-shadow: 0 16px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(103, 232, 249, 0.05);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    pointer-events: auto;
  }
  #graph-dossier[hidden] { display: none; }
  .dossier-header {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .dossier-header-actions {
    display: flex;
    flex: 0 0 auto;
    gap: 6px;
  }
  .dossier-icon-button, .dossier-step-button {
    display: grid;
    position: relative;
    place-items: center;
    box-sizing: border-box;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #8b96c9;
  }
  .dossier-icon-button::before, .dossier-step-button::before {
    position: absolute;
    inset: 6px;
    content: "";
    border: 1px solid rgba(103, 232, 249, 0.22);
    border-radius: 999px;
    background: rgba(22, 27, 52, 0.9);
  }
  .dossier-icon-button[hidden], .dossier-step-button[hidden], .dossier-step[hidden] { display: none; }
  .dossier-icon-button svg, .dossier-step-button svg {
    position: relative;
    z-index: 1;
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dossier-delete { color: #ef9898; }
  .dossier-close { color: #dbe4ff; }
  .dossier-eyebrow {
    display: flex;
    flex: 1 1 auto;
    align-items: baseline;
    gap: 9px;
    min-width: 0;
    overflow: hidden;
    font: 700 9.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  #dossier-kind { color: #67e8f9; }
  #dossier-project {
    overflow: hidden;
    color: #8b96c9;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #dossier-text {
    flex: 1 1 auto;
    min-height: 0;
    margin-top: 11px;
    overflow-y: auto;
    color: #dbe4ff;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
    -webkit-user-select: text;
    user-select: text;
  }
  .dossier-step {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-top: 10px;
  }
  #dossier-step-counter {
    min-width: 72px;
    color: #8b96c9;
    font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.06em;
    text-align: center;
  }
  .dossier-actions {
    display: grid;
    flex: 0 0 auto;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding-top: 12px;
  }
  .dossier-actions button {
    height: 44px;
    min-width: 0;
    padding: 0 8px;
    overflow: hidden;
    border: 1px solid rgba(103, 232, 249, 0.22);
    border-radius: 8px;
    background: rgba(12, 15, 30, 0.78);
    color: #dbe4ff;
    font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .dossier-actions button:active {
    border-color: rgba(103, 232, 249, 0.55);
    color: #e6f6ff;
    background: rgba(22, 27, 52, 0.96);
  }
  .dossier-icon-button:active::before, .dossier-step-button:active::before {
    border-color: rgba(103, 232, 249, 0.55);
    background: rgba(22, 27, 52, 0.96);
  }
  .dossier-icon-button:active, .dossier-step-button:active { color: #e6f6ff; }

</style>
</head>
<body>
  <div id="graph-canvas" data-fx="off"></div>
  <div id="graph-status">Loading graph…</div>
  <aside id="graph-dossier" role="dialog" aria-label="Node details" aria-hidden="true" hidden>
    <div class="dossier-header">
      <div class="dossier-eyebrow">
        <span id="dossier-kind"></span>
        <span id="dossier-project"></span>
      </div>
      <div class="dossier-header-actions">
        <button class="dossier-step-button" type="button" id="memory-dossier-prev" aria-label="Previous node" data-action="previous" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5-5 5 5 5"></path></svg>
        </button>
        <button class="dossier-step-button" type="button" id="memory-dossier-next" aria-label="Next node" data-action="next" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"></path></svg>
        </button>
        <button class="dossier-icon-button" type="button" aria-label="Edit" data-action="edit" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4 16l3.4-.8L16 6.6a1.8 1.8 0 0 0-2.6-2.6l-8.6 8.6L4 16Z"></path>
            <path d="m12.3 5.1 2.6 2.6M4.8 12.6l2.6 2.6"></path>
          </svg>
        </button>
        <button class="dossier-icon-button dossier-delete" type="button" aria-label="Delete" data-action="delete" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3.5 5.5h13M8 5.5V3.8h4v1.7M5.5 5.5l.7 10.7h7.6l.7-10.7M8 8.5v4.8M12 8.5v4.8"></path>
          </svg>
        </button>
        <button class="dossier-icon-button dossier-close" type="button" aria-label="Close" data-action="close">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 5 10 10M15 5 5 15"></path>
          </svg>
        </button>
      </div>
    </div>
    <div id="dossier-text"></div>
    <div class="dossier-step" hidden>
      <span id="dossier-step-counter"></span>
    </div>
    <div class="dossier-actions">
      <button type="button" data-action="focus">Focus</button>
      <button type="button" data-action="openProject">Open project</button>
      <button type="button" data-action="share">Share</button>
    </div>
  </aside>

  <script src="phren-graph.js"></script>
  <script>
  (function () {
    var status = document.getElementById("graph-status");
    var dossier = document.getElementById("graph-dossier");
    var dossierKind = document.getElementById("dossier-kind");
    var dossierProject = document.getElementById("dossier-project");
    var dossierText = document.getElementById("dossier-text");
    var dossierEdit = dossier.querySelector('[data-action="edit"]');
    var dossierDelete = dossier.querySelector('[data-action="delete"]');
    var dossierPrev = document.getElementById("memory-dossier-prev");
    var dossierNext = document.getElementById("memory-dossier-next");
    var dossierStep = dossier.querySelector(".dossier-step");
    var dossierStepCounter = document.getElementById("dossier-step-counter");
    var payloadNodes = [];
    var selectedNode = null;
    function setStatus(text) {
      if (!text) { status.hidden = true; return; }
      status.hidden = false;
      status.textContent = text;
    }

    function post(name, body) {
      var handler = window.webkit
        && window.webkit.messageHandlers
        && window.webkit.messageHandlers[name];
      if (handler) handler.postMessage(body);
    }

    window.addEventListener("error", function () {
      post("graphError", { message: "The renderer encountered an error." });
    });
    window.addEventListener("unhandledrejection", function () {
      post("graphError", { message: "The renderer couldn't finish loading." });
    });

    // Swift calls this with the payload built on-device by GraphBuilder.
    window.phrenHost = {
      render: function (payload) {
        if (!window.phrenGraph) {
          setStatus("Renderer failed to load");
          post("graphError", { message: "window.phrenGraph is undefined" });
          return;
        }
        try {
          wire();
          payloadNodes = payload && Array.isArray(payload.nodes) ? payload.nodes : [];
          window.phrenGraph.mount(payload);
          setStatus(payload && payload.nodes && payload.nodes.length ? "" : "Nothing to show yet");
          wire();
        } catch (err) {
          setStatus("Could not draw the graph");
          post("graphError", { message: String((err && err.message) || err) });
        }
      },
      focusNode: function (id) {
        if (!window.phrenGraph || !window.phrenGraph.focusNode) return;
        var node = payloadNodes.find(function (candidate) { return candidate.id === id; });
        var alreadySelected = selectedNode && selectedNode.id === id;
        // Host-driven selection owns the dossier immediately. The renderer
        // still handles camera movement and reports its normalized node later.
        if (node) showDossier(node);
        if (!alreadySelected) window.phrenGraph.focusNode(id);
      },
      revealNode: function (id) {
        window.phrenGraph.clearSelection();
        window.phrenGraph.peekNode(id);
      },
      reset: function () { window.graphReset(); },
      zoom: function (factor) { window.graphZoom(factor); },
      clear: function () { window.phrenGraph.clearSelection(); },
    };

    function showDossier(node) {
      selectedNode = node;
      var id = String(node.id || "");
      // Only findings written to FINDINGS.md and tasks have a line to rewrite;
      // journal findings and projects do not.
      var editable = id.indexOf("finding:") === 0 || id.indexOf(":task:") !== -1;
      dossierEdit.hidden = !editable;
      dossierDelete.hidden = !editable;
      dossier.style.display = "";
      dossier.hidden = false;
      dossier.setAttribute("aria-hidden", "false");
      dossierKind.textContent = kindTitle(node);
      dossierProject.textContent = node.project || node.projectName || node.label || node.id;
      dossierText.textContent = node.fullLabel || node.label || node.text || node.id;
      updateStepControls(node);
      document.body.classList.add("dossier-open");
    }

    function hideDossier() {
      selectedNode = null;
      dossierEdit.hidden = true;
      dossierDelete.hidden = true;
      dossierPrev.hidden = true;
      dossierNext.hidden = true;
      dossierStep.hidden = true;
      dossier.hidden = true;
      dossier.setAttribute("aria-hidden", "true");
      dossier.style.display = "none";
      dossierText.textContent = "";
      dossierStepCounter.textContent = "";
      document.body.classList.remove("dossier-open");
    }

    function kindTitle(node) {
      if (node.kind === "task" || String(node.group || "").indexOf("task-") === 0) return "Task";
      if (node.kind === "finding" || String(node.group || "").indexOf("topic:") === 0) return "Finding";
      return "Project";
    }

    // The renderer owns the ranked walk (graph-core's rankedProjectIds: the
    // project's findings newest first, then its tasks, the order the Memory
    // list shows) and the Left/Right keys; the page only draws the controls.
    function stepPosition(id) {
      var api = window.phrenGraph;
      return api && api.dossierPosition ? api.dossierPosition(id) : null;
    }

    function updateStepControls(node) {
      var pos = stepPosition(String(node.id || ""));
      dossierPrev.hidden = !pos;
      dossierNext.hidden = !pos;
      dossierStep.hidden = !pos;
      dossierStepCounter.textContent = pos ? (pos.index + 1) + " of " + pos.total : "";
    }

    function stepSelection(delta) {
      if (!selectedNode) return;
      var api = window.phrenGraph;
      var target = api && api.stepDossier ? api.stepDossier(selectedNode.id, delta) : null;
      if (!target) return;
      post("graphAction", { action: "select", id: target });
    }

    dossier.addEventListener("click", function (event) {
      var button = event.target.closest("button[data-action]");
      if (!button || !selectedNode) return;
      var action = button.getAttribute("data-action");
      var id = selectedNode.id;
      if (action === "previous" || action === "next") {
        stepSelection(action === "previous" ? -1 : 1);
        return;
      }
      if (action === "close") hideDossier();
      post("graphAction", { action: action, id: id });
    });

    var wired = false;
    function wire() {
      if (wired) return;
      wired = true;

      window.phrenGraph.onNodeSelect(function (node) {
        showDossier(node);
        post("graphSelect", serialize(node));
      });
      window.phrenGraph.onSelectionClear(function () {
        hideDossier();
        post("graphSelect", null);
      });
    }

    // Only the fields Swift needs to resolve a node back to a markdown line.
    function serialize(node) {
      if (!node) return null;
      return {
        id: node.id,
        kind: node.kind,
        group: node.group,
        project: node.project,
        store: node.store,
        label: node.label,
        fullLabel: node.fullLabel,
        text: node.text,
        scoreKey: node.scoreKey,
        editedText: node.editedText,
        editedSection: node.editedSection,
        editedPriority: node.editedPriority,
      };
    }

    post("graphReady", {});
  })();
  </script>
</body>
</html>
